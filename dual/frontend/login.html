<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>深瞳锐巡系统 V1.0</title>
  <link rel="icon" href="logo.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Inter:wght@300;400;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/login.css">
</head>

<body>
  <canvas id="bg-canvas"></canvas>
  <div class="overlay"></div>

  <div id="login-view" class="view-container active">
    <div class="login-box">
      <div class="login-header">
        <div class="logo-icon"><i class="fa-solid fa-eye"></i></div>
        <h1>深瞳锐巡系统 <span class="version">V1.0</span></h1>
        <p class="subtitle">DEEP SIGHT PATROL SYSTEM</p>
      </div>
      <form id="login-form">
        <div class="input-group">
          <i class="fa-solid fa-user"></i>
          <input type="text" placeholder="请输入用户名" required>
        </div>
        <div class="input-group">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password-input" placeholder="请输入密码" required>
          <span class="icon-eye-toggle" id="toggle-password"></span>
        </div>
        <button type="submit" class="btn-primary">
          <span class="btn-text">立即登录</span>
          <span class="btn-glitch"></span>
        </button>
      </form>
      <div class="login-footer">
        <div class="footer-left">
          没有帐号？先<a href="register.html" class="link-register">注册</a>吧！
        </div>
        <div class="footer-right">
          <span class="link-forgot">忘记密码</span>
        </div>
      </div>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>

</html>
